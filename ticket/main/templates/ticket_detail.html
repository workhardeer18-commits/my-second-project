{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header">
        <h3>موضوع: {{ ticket.subject }}</h3>
    </div>
    <div class="card-body">
        {% for conv in conversations %}
            <div class="mb-3 p-2 border rounded {% if conv.sender == user %}bg-light text-end{% else %}bg-white{% endif %}">
                <strong>{{ conv.sender.username }}:</strong>
                <p>{{ conv.message }}</p>
                <small class="text-muted">{{ conv.created_at|timesince }} پیش</small>
            </div>
        {% endfor %}
    </div>
    <div class="card-footer">
        <form method="POST">
            {% csrf_token %}
            <textarea name="message" class="form-control mb-2" placeholder="پاسخ شما..." required></textarea>
            <button type="submit" class="btn btn-primary">ارسال پاسخ</button>
        </form>
    </div>
</div>
{% endblock %}
